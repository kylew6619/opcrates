key_backpacks:
  enabled: true
  auto_pickup: true  # If true, keys go directly into the backpack
  allow_withdraw: true  # If true, players can withdraw keys manually
  tradeable: false  # If true, players can trade, sell, or auction backpacks
  disable_in_worlds:
    - "hub"
    - "event"
gui:
  title: "&6&lYour Key Backpack"  # Customizable GUI title
  size: 54  # Max size (9, 18, 27, 36, 45, 54)
  layout:
    "0": "glass"  # Slot 0 = Glass filler
    "1": "vote"  # Slot 1 = Vote Key Display
    "2": "legendary"  # Slot 2 = Legendary Key Display
    "3": "mythic"  # Slot 3 = Mythic Key Display
    "8": "close_button"  # Slot 8 = Close button
keys:
  vote:  # NAME EXACTLY CRATE
    display_name: "&aVote Key" # DISPLAY NAME GUI
    material: "TRIPWIRE_HOOK"
    storage_limit: 100
    lore:
      - "&7Store &eVote Keys &7automatically!"
      - "&7Keys Owned: &e%amount%"
      - "&7Storage Limit: &c%limit%"
  legendary:
    display_name: "&dLegendary Key"
    material: "GOLD_NUGGET"
    storage_limit: 50
    lore:
      - "&7This key is ultra rare!"
      - "&7Keys Owned: &e%amount%"
      - "&7Storage Limit: &c%limit%"
  mythic:
    display_name: "&bMythic Key"
    material: "DIAMOND"
    storage_limit: -1  # -1 means unlimited storage
    lore:
      - "&7Only the best players earn these!"
      - "&7Keys Owned: &e%amount%"
      - "&7Storage Limit: &aUnlimited"

disabled_keys:
  - "basic"
  - "common"

