lore-preview:
  - "&7This is a reward item"
  - "&dChance: {chance}%"
  - "&aStutus: {status}"
  - "&eClick Change Status!"

summary-text:
  - "&7Summary of &a{player}'s"
  - "{rewards}"
  - " "
  - "&7Join Server "

#Impulse knock

impulse-vector: 0.3
impulse-y: 0.3

#Opening title crate normal

title-gui-opening-crate: "&6Opening {crate}"

#Duration

duration-crate-opening: 5 #seconds
duration-lootbox-opening: 5 #seconds

status-color:
  ENABLED:
    color: DARK_GREEN
    bold: true
  DISABLED:
    color: RED
    bold: false

#virtual reward
hologram-reward-size:
  x: 1.0
  y: 1.0
  z: 1.0

#virtual menu
menu-virtual:
  title: "&cCrate %name%"
  size: 36
  slots:
    13:
      material: CHEST
      name: "&cTreasure %name%"
      crate: yes
      lore:
        - " "
        - "&7View &f8 &7OP chests and pick %max_reward%"
        - "&7to uncover &aamazing treasures"
        - " "
        - "&7Discover"
        - " "
        - "&aOwned &7> &f%owned%"
        - " "
        - "&cRight-Click to preview"
    20:
      material: BLACK_STAINED_GLASS
      name: " "




filter-menu:
  title: "&cFilter Menu"
  slots:
    0:
      type: item
      material: BLACK_STAINED_GLASS_PANE
      name: ""
    1:
      type: item
      material: BLACK_STAINED_GLASS_PANE
      name: ""
    2:
      type: item
      material: BLACK_STAINED_GLASS_PANE
      name: ""
    3:
      type: item
      material: BLACK_STAINED_GLASS_PANE
      name: ""
    4:
      type: item
      material: BOOK
      name: "&a&lREWARD FILTER"
      lore:
        - "&7Select a feature filter"
    19:
      type: crate-item
      crate: test
      lore:
        - "&cClick to filter this"
        - "{status}"
    20:
      type: crate-key
      crate: test
      lore:
        - "&cClick to filter this"
        - "{status}"



messages:
  disabled-reward-limit: "❌ You have reached the limit of disabled rewards for this crate ( {max_allowed )"
  disabled-reward-remove: "✅ Reward {reward} has been enabled!"
  disabled-reward-add: "⛔ Reward {reward} has been disabled"
  opening-lootbox: "&cOpening lootbox {lootbox}"
  no_key_crate: "&c&l(!) &cYou don't have the key {crate}"
  create_crate_name: "&c&l(!) &7Specify the name and displayName"
  already_exist_crate: "&c&l(!) &cAlready exist crate"
  crate_success: "&c&L(!) Crate {name} crated!"
  no_crate_name_key: "&c&l(!) &cSpecify the name of the Crate"
  crate_no_exist: "&c&l(!) &cThere is no such Crate"
  crate_reward_no_hand: "&c&l(!) &cHave an item in your hand"
  crate_set_key: "&c&l(!) &cCrate Set Key Success {crate}"
  crate_win_item: "&aYou won: {item_reward}"
  backpack-left-click: "&aYou have withdrawn {crate} {amount}"
  backpack-right-click: "&aYou have open {crate} {amount}"
  backpack-disabled-withdraw: "&aCrates cannot be removed at this time."
  backpack-deposit: "&cYou deposit {crate} {amount}"
  backpack-not-enough-space: "&cYou don't have enough inventory space. Need {needed}, but you only have {available}."
  backpack-full: "&cYour key backpack for {crate} full. You cannot deposit more."
  filter-remove: "&cItem remove filter {name}"
  filter-add: "&cItem add filter {name}"

